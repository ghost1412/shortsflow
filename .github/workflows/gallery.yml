name: Clip Gallery

# Makes captioned vertical clips (animated captions, hook title) from one public video on GitHub's runners, for the clips gallery.
# CPU only, no AI key, no upload. The clips are an artifact of the run (not committed: videos stay out of git).
# Start it from the Actions tab. The default video is the public-domain space podcast.

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct file URL of a long public-domain / Creative Commons video'
        required: false
        default: 'https://upload.wikimedia.org/wikipedia/commons/7/7e/Podcast_Live_from_Space-_Astronaut_Photography.webm'
      clip_count:
        description: 'Number of clips'
        required: false
        default: '5'
      visual_template:
        description: 'Visual template (none or a name from docs/TEMPLATES.md)'
        required: false
        default: 'none'
      name:
        description: 'Short name for the artifact (letters, digits, dash)'
        required: false
        default: 'gallery'

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: remotion-video/package-lock.json

      - name: System packages (FFmpeg, Pango, Chromium libs, fonts)
        run: |
          apt() { for i in 1 2 3 4; do sudo apt-get -o Acquire::Retries=5 "$@" && return 0; echo "apt-get failed ($i/4), retrying in 30 s"; sleep 30; done; return 1; }
          apt update
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          apt install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config libglib2.0-dev \
            libnss3 libatk-bridge2.0-0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 \
            libpangocairo-1.0-0 libgtk-3-0 ttf-mscorefonts-installer
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e ".[clip]"
          cd remotion-video && npm ci

      - name: Download video
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: |
          curl -fL --retry 3 -A "ShortsFlow-gallery/1.0" -o video.webm "$VIDEO_URL"
          ls -lh video.webm

      - name: Make the clips (no upload)
        env:
          SHORTSFLOW_WHISPER_MODEL: base
          CLIP_COUNT: ${{ github.event.inputs.clip_count || '5' }}
          TEMPLATE: ${{ github.event.inputs.visual_template || 'none' }}
        run: |
          TPL_ARGS=()
          if [ "$TEMPLATE" != "none" ]; then TPL_ARGS=(--visual_template "$TEMPLATE"); fi
          python main.py --source_video video.webm --extract_mode shorts --clip_count "$CLIP_COUNT" \
            --target_duration 30 --min_duration 18 --smart_crop --tighten --layout auto \
            --use_remotion --caption_style HORMOZI --hook_overlay \
            --skip-upload --session_dir gallery --output_json gallery/results.json "${TPL_ARGS[@]}"

      - name: Collect the clips
        run: |
          mkdir -p out
          python - <<'EOF'
          import glob, json, os, shutil
          res = json.load(open("gallery/results.json"))
          rows = []
          for i, c in enumerate(res.get("clips", []), 1):
              p = c.get("video_path") or ""
              cands = [p, os.path.join("gallery", os.path.basename(p))] + glob.glob(f"gallery/**/video_clip_{i}.mp4", recursive=True)
              src = next((x for x in cands if x and os.path.isfile(x)), None)
              if not src:
                  continue
              dst = f"out/clip_{i}.mp4"
              shutil.copy(src, dst)
              rows.append({"file": dst, "start": c.get("start"), "end": c.get("end"), "title": c.get("title"), "hook": c.get("hook"),
                           "reason": c.get("reason"), "score": c.get("viral_score")})
          json.dump(rows, open("out/clips.json", "w"), indent=1)
          print(len(rows), "clips collected")
          EOF
          ls -lh out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-${{ github.event.inputs.name || 'gallery' }}
          path: |
            out/*.mp4
            out/clips.json
            gallery/results.json
          if-no-files-found: warn
          retention-days: 30
